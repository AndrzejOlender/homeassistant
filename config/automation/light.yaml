# LED RTV backlight controlled by TV state (only after dark)
- alias: "Turn On LED RTV on TV On"
  id: turn_on_led_rtv_on_tv_on
  description: "Turn on LED RTV backlight when TV is turned on (only after dark)"
  mode: single
  trigger:
    - platform: state
      entity_id: media_player.tv_webos
      to: "on"
  condition:
    - condition: or
      conditions:
        - condition: sun
          after: sunset
          after_offset: "-00:15:00"
        - condition: sun
          before: sunrise
          before_offset: "-00:15:00"
  action:
    - service: light.turn_on
      target:
        entity_id: light.led_rtv

- alias: "Turn Off LED RTV on TV Off"
  id: turn_off_led_rtv_on_tv_off
  description: "Turn off LED RTV backlight when TV is turned off (only after dark)"
  mode: single
  trigger:
    - platform: state
      entity_id: media_player.tv_webos
      to: "off"
  condition:
    - condition: or
      conditions:
        - condition: sun
          after: sunset
          after_offset: "-00:15:00"
        - condition: sun
          before: sunrise
          before_offset: "-00:15:00"
  action:
    - service: light.turn_off
      target:
        entity_id: light.led_rtv

# Stairs light auto-off timeout
- alias: "Turn Off Stairs Light After Timeout"
  id: turn_off_stairs_light_after_timeout
  description: "Turn off stairs light automatically 5 minutes after it turns on"
  mode: single
  trigger:
    - platform: state
      entity_id: light.shelly_stairs_light_1
      to: "on"
      for:
        minutes: 5
  action:
    - service: light.turn_off
      target:
        entity_id: light.shelly_stairs_light_1

# Office lighting driven by MacBook Pro (Andrzej) activity via the HA companion app
- alias: "Turn On Office Lights on MacBook Active"
  id: turn_on_office_lights_on_macbook_active
  description: "Run Work Mode when the MacBook Pro (Andrzej) becomes active (awake and unlocked) and docked at the desk (Ethernet)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.macbook_pro_andrzej_active
      to: "on"
  condition:
    - condition: state
      entity_id: sensor.macbook_pro_andrzej_connection_type
      state: "Ethernet"
  action:
    - service: script.work_mode

# The companion app's "Active" sensor is known to occasionally get stuck "on"
# (community reports) - re-check its live state before actually turning off,
# in case it already flickered back to "on" by the time this runs.
- alias: "Turn Off Office Lights on MacBook Inactive"
  id: turn_off_office_lights_on_macbook_inactive
  description: "Turn off desk LED and office lamp as soon as the MacBook Pro (Andrzej) stops being active (locked or asleep), unless a camera call is currently in progress"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.macbook_pro_andrzej_active
      from: "on"
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: binary_sensor.macbook_pro_andrzej_active
          state: "on"
    - condition: state
      entity_id: binary_sensor.macbook_pro_andrzej_camera_in_use
      state: "off"
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.desk_led
          - light.office_lamp

- alias: "Turn Office Lights Orange on MacBook Camera In Use"
  id: turn_office_lights_orange_on_macbook_camera_in_use
  description: "Snapshot office lamp + desk LED state and turn them orange while the MacBook Pro (Andrzej) camera is in use (at home only)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.macbook_pro_andrzej_camera_in_use
      to: "on"
      for:
        seconds: 1
  condition:
    - condition: state
      entity_id: sensor.macbook_pro_andrzej_connection_type
      state: "Ethernet"
  action:
    - service: scene.create
      data:
        scene_id: before_camera_office_lights
        snapshot_entities:
          - light.office_lamp
          - light.desk_led
    - service: light.turn_on
      target:
        entity_id:
          - light.office_lamp
          - light.desk_led
      data:
        color_name: orange

- alias: "Restore Office Lights After MacBook Camera In Use"
  id: restore_office_lights_after_macbook_camera_in_use
  description: "Restore office lamp and desk LED to their pre-call state once the MacBook Pro (Andrzej) camera stops being in use; if the MacBook is already inactive by then, turn them off instead (only when docked on Ethernet, matching the orange-on-call automation)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.macbook_pro_andrzej_camera_in_use
      from: "on"
      for:
        seconds: 1
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.macbook_pro_andrzej_active
              state: "on"
          sequence:
            - service: scene.turn_on
              target:
                entity_id: scene.before_camera_office_lights
      default:
        - condition: state
          entity_id: sensor.macbook_pro_andrzej_connection_type
          state: "Ethernet"
        - service: light.turn_off
          target:
            entity_id:
              - light.desk_led
              - light.office_lamp