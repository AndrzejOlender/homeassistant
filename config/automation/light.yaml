

# Toilet Up presence-based light control (night mode after 23:00)
- alias: "Turn On Light Toilet Up on Presence"
  description: "Turn on toilet light when presence is detected, night mode after 23:00"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presense_sensor_toilet_up
      from: "off"
      to: "on"
  action:
    - choose:
        - conditions:
            - condition: time
              after: "23:00:00"
              before: "04:00:00"
          sequence:
            - service: light.turn_on
              target:
                entity_id:
                  - light.shelly_cabinet_1_light_1
                  - light.shelly_toilet_up_wall_light_1
                  - light.shelly_toilet_up_bath
      default:
        - service: light.turn_on
          target:
            entity_id: light.shelly_toilet_up_light_1

- alias: "Turn Off Light Toilet Up on No Presence"
  description: "Turn off toilet lights when no presence detected"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presense_sensor_toilet_up
      from: "on"
      to: "off"
      for:
        seconds: 600
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.shelly_toilet_up_light_1
          - light.shelly_cabinet_1_light_1
          - light.shelly_toilet_up_wall_light_1
          - light.shelly_toilet_up_bath

# Extra lights triggered by bath light
- alias: "Turn On Extra Lights Toilet Up on Bath Light On"
  description: "Turn on cabinet and wall lights when bath light is turned on"
  mode: single
  trigger:
    - platform: state
      entity_id: light.shelly_toilet_up_bath
      from: "off"
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id:
          - light.shelly_cabinet_1_light_1
          - light.shelly_toilet_up_wall_light_1

- alias: "Turn Off Extra Lights Toilet Up on Bath Light Off"
  description: "Turn off cabinet and wall lights when bath light is turned off"
  mode: single
  trigger:
    - platform: state
      entity_id: light.shelly_toilet_up_bath
      from: "on"
      to: "off"
  action:
    - service: light.turn_off
      target:
        entity_id:
          - light.shelly_cabinet_1_light_1
          - light.shelly_toilet_up_wall_light_1