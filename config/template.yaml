# Live display of the current G12W rate. NOT what bills the Energy dashboard -
# that is scripts/tauron_g12w_cost.py (external statistic tauron_g12w:cost).
# The same zone schedule is implemented in both; change it in both or the
# displayed price will silently disagree with the billed cost.
- sensor:
    - name: "Tauron G12W Price"
      unique_id: tauron_g12w_price
      unit_of_measurement: "PLN/kWh"
      state: >
        {% set day_rate = states('input_number.tauron_g12w_day_rate') | float(0) %}
        {% set night_rate = states('input_number.tauron_g12w_night_rate') | float(0) %}
        {% if now().isoweekday() >= 6 %}
          {{ night_rate | round(4) }}
        {% elif (6 <= now().hour < 13) or (15 <= now().hour < 22) %}
          {{ day_rate | round(4) }}
        {% else %}
          {{ night_rate | round(4) }}
        {% endif %}

- binary_sensor:
    - name: "Vacuum Cleaning"
      state: "{{ is_state('vacuum.john', 'cleaning') }}"
    - name: "Lock"
      state: "{{ is_state('lock.aqara_smart_lock_u200', 'unlocked') }}"
      icon: >-
        {% if is_state('binary_sensor.lock', 'on') %}
          mdi:lock-open
        {% else %}
          mdi:lock
        {% endif %}
