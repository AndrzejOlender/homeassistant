# Washer / dryer (Electrolux HomeWhiz) notifications (push only, no TTS).
# "Done" and error events come from event entities (event.*_notification,
# event.*_error) via the event.received trigger. Unloading is signalled by
# the user powering the machine off (switch.*_power).
# Notifications go to iPhone + active MacBook only (not Ania's phone).

- alias: "Washer Finished"
  id: notify_washer_finished
  mode: single
  triggers:
    - trigger: event.received
      target:
        entity_id: event.pralka_notification
      options:
        event_type:
          - washing_is_complete
  actions:
    - action: notify.mobile_app_iphone
      data:
        title: "Washer"
        message: "Washing complete"
        data:
          actions:
            - action: "POWER_OFF_WASHER"
              title: 'Power off'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
    - action: script.notify_active_mac
      data:
        title: "Washer"
        message: "Washing complete"

# Reminder if the finished laundry is still in the drum 2 hours later
# (user powering the washer off counts as "taken out").
- alias: "Washer Laundry Reminder"
  id: notify_washer_laundry_reminder
  mode: single
  triggers:
    - trigger: event.received
      target:
        entity_id: event.pralka_notification
      options:
        event_type:
          - washing_is_complete
  actions:
    - delay: "02:00:00"
    - condition: state
      entity_id: switch.pralka_power
      state: "on"
    - action: notify.mobile_app_iphone
      data:
        title: "Washer"
        message: "Laundry still in the drum - take it out"
    - action: script.notify_active_mac
      data:
        title: "Washer"
        message: "Laundry still in the drum - take it out"

# Washer problems: error_during_washing notification or one of the machine
# error events (water supply, drain, door, motor...).
- alias: "Washer Alert"
  id: notify_washer_alert
  mode: single
  triggers:
    - trigger: event.received
      id: notification
      target:
        entity_id: event.pralka_notification
      options:
        event_type:
          - error_during_washing
    - trigger: event.received
      id: error
      target:
        entity_id: event.pralka_error
      options:
        event_type:
          - water_drain_error
          - door_open_error
          - unable_to_lock_error
          - water_supply_error
          - out_of_balance_error
          - power_fail_error
          - overfill_error
          - water_level_sensor_error
          - locked_motor_error
          - temperature_sensor_error
  variables:
    # The event entity records the fired type in its attributes.
    washer_problem: >-
      {{ trigger.to_state.attributes.event_type
         | replace('_error', '') | replace('_', ' ') }}
  actions:
    - action: notify.mobile_app_iphone
      data:
        title: "Washer Problem"
        message: "{{ washer_problem | capitalize }}"
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0
    - action: script.notify_active_mac
      data:
        title: "Washer Problem"
        message: "{{ washer_problem | capitalize }}"

