smart_home:
  locale: en-US
  endpoint: https://api.amazonalexa.com/v3/events
  client_id: !secret alexa_client_id
  client_secret: !secret alexa_client_secret

  filter:
    # Lights: mirror config/homekit.yaml — expose all lights, drop indicator LEDs
    include_entity_globs:
      - light.*
    exclude_entities:
      - light.u6_pro_led
      - light.u7_pro_xg_led
      - light.home_assistant_voice_093e77_led_ring
    include_entities:
      - fan.air_purifier
      - vacuum.john
      - lock.aqara_smart_lock_u200
      # Media players
      - media_player.tv_webos
      - media_player.living_room
      - media_player.office_2
      - media_player.toilet_up
      # Appliances
      - switch.pralka_power
      - switch.szuszarka_power
      # Scripts — Good Night routine + per-room vacuum
      - script.good_night
      - script.clean_home
      - script.clean_hall
      - script.clean_dining_room
      - script.clean_kitchen
      - script.clean_living_room
      - script.clean_toilet_down
      - script.stop_clean_home
      # Scenes
      - scene.good_morning
      - scene.good_evening
      - scene.cinema

  entity_config:
    # --- Lights (room-qualified, unique names for unambiguous voice control) ---
    light.shelly_living_room_light_1: { name: "Living Room Light 1" }
    light.shelly_living_room_light_2: { name: "Living Room Light 2" }
    light.led_rtv:                    { name: "TV LED" }
    light.shelly_office_1_light_1:    { name: "Office Light 1" }
    light.shelly_office_1_light_2:    { name: "Office Light 2" }
    light.desk_led:                   { name: "Desk" }
    light.office_lamp:                { name: "Office Lamp" }
    light.shelly_bedroom_light_1:     { name: "Bedroom" }
    light.shelly_kitchen_light_1:     { name: "Kitchen" }
    light.shelly_table_light_1:       { name: "Dining Table" }
    light.shelly_toilet_up_light_1:   { name: "Upstairs Toilet" }
    light.shelly_toilet_up_mirror:    { name: "Mirror" }
    light.shelly_toilet_up_bath:      { name: "Bath" }
    light.shelly_cabinet_1_light_1:   { name: "Cabinet" }
    light.shelly_toilet_up_wall_light_1: { name: "Wall" }
    light.shelly_toilet_down_light_1: { name: "Downstairs Toilet" }
    light.shelly_hall_down_light:     { name: "Downstairs Hall" }
    light.shelly_hall_up_light_1:     { name: "Upstairs Hall" }
    light.shelly_stairs_light_1:      { name: "Stairs" }
    light.shelly_child_room_1:        { name: "Child Room" }

    # --- Media players (TVs keep default TV category; Sonos must be SPEAKER) ---
    media_player.tv_webos:    { name: "TV" }
    media_player.living_room: { name: "Apple TV" }
    media_player.office_2:    { name: "Office Speaker",   display_categories: SPEAKER }
    media_player.toilet_up:   { name: "Bathroom Speaker", display_categories: SPEAKER }

    # --- Fan / vacuum / lock ---
    fan.air_purifier:           { name: "Air Purifier", display_categories: AIR_PURIFIER }
    vacuum.john:                { name: "Vacuum" }
    lock.aqara_smart_lock_u200: { name: "Front Door" }

    # --- Appliances ---
    switch.pralka_power:    { name: "Washing Machine" }
    switch.szuszarka_power: { name: "Dryer" }

    # --- Scripts (HA maps to ACTIVITY_TRIGGER; "turn off" stops them) — name only ---
    script.good_night:        { name: "Good Night" }
    script.clean_home:        { name: "Clean Home" }
    script.clean_hall:        { name: "Clean Hall" }
    script.clean_dining_room: { name: "Clean Dining Room" }
    script.clean_kitchen:     { name: "Clean Kitchen" }
    script.clean_living_room: { name: "Clean Living Room" }
    script.clean_toilet_down: { name: "Clean Toilet" }
    script.stop_clean_home:   { name: "Stop Cleaning" }

    # --- Scenes (HA maps to SCENE_TRIGGER; activate only) — name only ---
    scene.good_morning: { name: "Good Morning" }
    scene.good_evening: { name: "Good Evening" }
    scene.cinema:       { name: "Cinema" }
