- alias: "Hall Light On When Door Unlocked"
  description: "Turn on hall light when front door lock is unlocked"
  mode: restart
  trigger:
    - platform: state
      entity_id: lock.aqara_smart_lock_u200
      to: "unlocked"
  action:
    - service: light.turn_on
      target:
        entity_id: light.shelly_hall_down_light
    - delay:
        minutes: 3
    - service: light.turn_off
      target:
        entity_id: light.shelly_hall_down_light

- alias: "Hall Light Off After Door Locked"
  description: "Turn off hall light 1 minute after front door lock is locked"
  mode: restart
  trigger:
    - platform: state
      entity_id: lock.aqara_smart_lock_u200
      to: "locked"
  action:
    - delay:
        minutes: 1
    - service: light.turn_off
      target:
        entity_id: light.shelly_hall_down_light

