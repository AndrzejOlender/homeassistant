## Configure a default setup
default_config:

# Custom ZHA quirks: Aqara Vibration Sensor T1 (DJT12LM, lumi.vibration.agl01) support
# See custom_zha_quirks/vibration_agl01.py
zha:
  custom_quirks_path: /config/custom_zha_quirks/

logger:
  default: error
#  logs:
#    homeassistant.components.camera: debug
#    homeassistant.components.stream: debug#
#    homeassistant.components.ffmpeg: debug
#    homeassistant.components.unifiprotect: debug
#    homeassistant.components.go2rtc: debug
#    custom_components.unifiprotect: debug
#    pyunifiprotect: debug
#    uiprotect: debug

network:

frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  customize: !include config/customize.yaml
  internal_url: "https://home.lan.olender.me"
  allowlist_external_urls:
    - "https://home.olender.me"
    - "https://home.lan.olender.me"
zone: !include config/zone.yaml
script: !include config/scripts.yaml
alexa: !include config/alexa/alexa.yaml
sonos: !include config/sonos.yaml
homekit: !include config/homekit.yaml
recorder: !include config/recorder.yaml
prometheus: !include config/prometheus.yaml
automation: !include_dir_merge_list config/automation
template: !include config/template.yaml
command_line: !include config/command_line.yaml
adaptive_lighting: !include config/adaptive_lighting.yaml
input_boolean: !include config/input_boolean.yaml
timer: !include config/timer.yaml
