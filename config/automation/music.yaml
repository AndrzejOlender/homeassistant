# Music automation for Toilet Up
- alias: "Play Music Toilet Up on Presence"
  id: play_music_toilet_up_on_presence
  description: "Resume paused music or start fresh album when presence detected"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presense_sensor_toilet_up
      from: "off"
      to: "on"
  condition:
    # Only between 04:00 and 23:15
    - condition: time
      after: "04:00:00"
      before: "23:15:00"
    # Skip if already playing — presence flicker shouldn't restart playback
    - condition: not
      conditions:
        - condition: state
          entity_id: media_player.toilet_up
          state: "playing"
    # Music block switch (helper): while on, auto-start is blocked for the
    # timer duration (30 min per switch-on, see timer.toilet_up_music_block)
    - condition: state
      entity_id: input_boolean.music_block_toilet_up
      state: "off"
  action:
    - service: media_player.volume_set
      data:
        volume_level: >
          {% if now().hour >= 4 and now().hour < 8 %}
            0.4
          {% else %}
            0.5
          {% endif %}
      target:
        entity_id: media_player.toilet_up
    - service: media_player.shuffle_set
      data:
        shuffle: true
      target:
        entity_id: media_player.toilet_up
    - service: media_player.play_media
      data:
        # Ania's playlist when she is home, alternative playlist otherwise
        media_content_id: >
          {{ 'library://playlist/60' if is_state('person.ania', 'home') else 'library://playlist/61' }}
        media_content_type: "playlist"
      target:
        entity_id: media_player.toilet_up

- alias: "Stop Music Toilet Up on No Presence"
  id: stop_music_toilet_up_on_no_presence
  description: "Pause music after 10 minutes without presence, or when all toilet lights are off"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presense_sensor_toilet_up
      from: "on"
      to: "off"
      for:
        seconds: 800
    - platform: state
      entity_id:
        - light.shelly_toilet_up_light_1
        - light.shelly_toilet_up_bath
        - light.shelly_toilet_up_wall_light_1
        - light.shelly_cabinet_1_light_1
      to: "off"
      for:
        seconds: 5
  condition:
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ trigger.entity_id == 'binary_sensor.presense_sensor_toilet_up' }}"
        - condition: and
          conditions:
            - condition: state
              entity_id: light.shelly_toilet_up_light_1
              state: "off"
            - condition: state
              entity_id: light.shelly_toilet_up_bath
              state: "off"
            - condition: state
              entity_id: light.shelly_toilet_up_wall_light_1
              state: "off"
            - condition: state
              entity_id: light.shelly_cabinet_1_light_1
              state: "off"
  action:
    - service: media_player.media_stop
      target:
        entity_id: media_player.toilet_up

# Music automation for Toilet Down
# NOTE: media_player.living_room is the Apple TV (tvOS app grid as source_list,
# aliased as "Apple TV" in alexa.yaml). Toilet Down music and Apple TV audio
# interfere with each other, so Toilet Down never plays while the ATV plays.
- alias: "Play Music Toilet Down on Presence"
  id: play_music_toilet_down_on_presence
  description: "Resume paused music or start fresh album when presence detected"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presence_sensor_toilet_down
      from: "off"
      to: "on"
  condition:
    # Only between 04:00 and 23:15
    - condition: time
      after: "04:00:00"
      before: "23:15:00"
    # Skip if already playing — presence flicker shouldn't restart playback
    - condition: not
      conditions:
        - condition: state
          entity_id: media_player.toilet_down
          state: "playing"
    # Don't start while something is playing on the Apple TV
    - condition: not
      conditions:
        - condition: state
          entity_id: media_player.living_room
          state: "playing"
    # Music block switch (helper): while on, auto-start is blocked for the
    # timer duration (30 min per switch-on, see timer.toilet_down_music_block)
    - condition: state
      entity_id: input_boolean.music_block_toilet_down
      state: "off"
  action:
    - service: media_player.volume_set
      data:
        volume_level: >
          {% if now().hour >= 4 and now().hour < 8 %}
            0.5
          {% else %}
            0.6
          {% endif %}
      target:
        entity_id: media_player.toilet_down
    - service: media_player.shuffle_set
      data:
        shuffle: true
      target:
        entity_id: media_player.toilet_down
    - service: media_player.play_media
      data:
        # Playlist wrapping the local album's tracks, not the raw album: Music
        # Assistant force-disables shuffle for "album" media on play_media
        # regardless of shuffle_set, but honors it for playlists.
        media_content_id: "library://playlist/63"
        media_content_type: "playlist"
      target:
        entity_id: media_player.toilet_down

- alias: "Stop Music Toilet Down on No Presence"
  id: stop_music_toilet_down_on_no_presence
  description: "Pause music after presence timeout, or when all toilet down lights are off"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presence_sensor_toilet_down
      from: "on"
      to: "off"
      for:
        seconds: 800
    - platform: state
      entity_id:
        - light.shelly_toilet_down_light_1
        - light.toilet_down_stand_led
        - light.shelly_toilet_down_mirror
      to: "off"
  condition:
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ trigger.entity_id == 'binary_sensor.presence_sensor_toilet_down' }}"
        - condition: and
          conditions:
            - condition: state
              entity_id: light.shelly_toilet_down_light_1
              state: "off"
            - condition: state
              entity_id: light.toilet_down_stand_led
              state: "off"
            - condition: state
              entity_id: light.shelly_toilet_down_mirror
              state: "off"
  action:
    - service: media_player.media_stop
      target:
        entity_id: media_player.toilet_down

# Stop Toilet Down music when the Apple TV starts playing - the two interfere.
- alias: "Stop Music Toilet Down on Apple TV Playing"
  id: stop_music_toilet_down_on_atv_playing
  description: "Toilet Down music interferes with Apple TV audio - stop it when the ATV starts playing"
  mode: single
  trigger:
    - platform: state
      entity_id: media_player.living_room
      to: "playing"
  condition:
    - condition: state
      entity_id: media_player.toilet_down
      state: "playing"
  action:
    - service: media_player.media_stop
      target:
        entity_id: media_player.toilet_down

# Toilet Up music block: switching the helper on starts/restarts the 30 min
# mute timer; when the timer finishes the helper resets itself, so the block
# always lasts exactly 30 min per switch-on. Switching the helper off cancels
# the block immediately.
- alias: "Toilet Up Music Block Timer Start"
  id: toilet_up_music_block_timer_start
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.music_block_toilet_up
      to: "on"
  action:
    - service: timer.start
      target:
        entity_id: timer.toilet_up_music_block

- alias: "Toilet Up Music Block Timer Finished"
  id: toilet_up_music_block_timer_finished
  mode: single
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.toilet_up_music_block
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.music_block_toilet_up

# Toilet Up music block: helper switched off manually also cancels the timer
- alias: "Toilet Up Music Block Timer Cancel"
  id: toilet_up_music_block_timer_cancel
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.music_block_toilet_up
      to: "off"
  condition:
    - condition: state
      entity_id: timer.toilet_up_music_block
      state: "active"
  action:
    - service: timer.cancel
      target:
        entity_id: timer.toilet_up_music_block

