    event_data:
      actionName: START_WHITE_FLOOR
  action:
    service: script.turn_on
    target:
      entity_id: script.clean_white_floor

- id: vulpo_la_vacuum_john__state_82DFD463
  alias: '[Vulpo] Live Activity roborock.john (Vulpo 1ee94a)'
  description: Created by Vulpo app — monitors roborock.john and updates Live Activity
  triggers:
  - entity_id: vacuum.john
    platform: state
  - for: 00:00:30
    value_template: '{% set s = states[''vacuum.john''] %}{% set done = (as_timestamp(states(''sensor.john_last_clean_end''),
      0) > as_timestamp(states(''sensor.john_last_clean_start''), 0) if as_timestamp(states(''sensor.john_last_clean_end''),
      0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) > 0 else
      false) %}{% set settled = states(''vacuum.john'') in [''docked'', ''idle'',
      ''off''] and s is not none and (done if as_timestamp(states(''sensor.john_last_clean_end''),
      0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) > 0 else
      (as_timestamp(now()) - as_timestamp(s.last_changed)) >= 570) %}{{ settled }}'
    platform: template
  actions:
  - data:
      data:
        live_activity:
          stale_date: '{% set s = states[''vacuum.john''] %}{% set done = (as_timestamp(states(''sensor.john_last_clean_end''),
            0) > as_timestamp(states(''sensor.john_last_clean_start''), 0) if as_timestamp(states(''sensor.john_last_clean_end''),
            0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) >
            0 else false) %}{% set settled = states(''vacuum.john'') in [''docked'',
            ''idle'', ''off''] and s is not none and (done if as_timestamp(states(''sensor.john_last_clean_end''),
            0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) >
            0 else (as_timestamp(now()) - as_timestamp(s.last_changed)) >= 570) %}{{
            (as_timestamp(now()) | int) if settled else ((as_timestamp(now()) + 600)
            | int) }}'
          dismissal_date: '{% set s = states[''vacuum.john''] %}{% set done = (as_timestamp(states(''sensor.john_last_clean_end''),
            0) > as_timestamp(states(''sensor.john_last_clean_start''), 0) if as_timestamp(states(''sensor.john_last_clean_end''),
            0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) >
            0 else false) %}{% set settled = states(''vacuum.john'') in [''docked'',
            ''idle'', ''off''] and s is not none and (done if as_timestamp(states(''sensor.john_last_clean_end''),
            0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) >
            0 else (as_timestamp(now()) - as_timestamp(s.last_changed)) >= 570) %}{{
            (as_timestamp(now()) + 300) | int if settled else 0 }}'
          event: '{% set s = states[''vacuum.john''] %}{% set done = (as_timestamp(states(''sensor.john_last_clean_end''),
            0) > as_timestamp(states(''sensor.john_last_clean_start''), 0) if as_timestamp(states(''sensor.john_last_clean_end''),
            0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) >
            0 else false) %}{% set settled = states(''vacuum.john'') in [''docked'',
            ''idle'', ''off''] and s is not none and (done if as_timestamp(states(''sensor.john_last_clean_end''),
            0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0) >
            0 else (as_timestamp(now()) - as_timestamp(s.last_changed)) >= 570) %}{{
            ''end'' if settled else ''update'' }}'
          content_state:
            lastUpdated: '{{ as_timestamp(now()) | int }}'
            vacuumStatusKey: '{{ states(''vacuum.john'') }}'
            vacuumFinished: '{% set s = states[''vacuum.john''] %}{% set done = (as_timestamp(states(''sensor.john_last_clean_end''),
              0) > as_timestamp(states(''sensor.john_last_clean_start''), 0) if as_timestamp(states(''sensor.john_last_clean_end''),
              0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0)
              > 0 else false) %}{% set settled = states(''vacuum.john'') in [''docked'',
              ''idle'', ''off''] and s is not none and (done if as_timestamp(states(''sensor.john_last_clean_end''),
              0) > 0 and as_timestamp(states(''sensor.john_last_clean_start''), 0)
              > 0 else (as_timestamp(now()) - as_timestamp(s.last_changed)) >= 570)
              %}{{ ''true'' if settled else ''false'' }}'
            vacuumBattery: '{{ states(''sensor.office_roborock_john_battery'') | float(0)
              | int if states(''sensor.office_roborock_john_battery'') not in [''unavailable'',
              ''unknown''] else '''' }}'
            vacuumAreaUnit: '{{ state_attr(''sensor.roborock_john_current_clean_area'',
              ''unit_of_measurement'') | default(''m²'', true) }}'
            vacuumAreaM2: '{{ states(''sensor.roborock_john_current_clean_area'')
              | float(0) if states(''sensor.roborock_john_current_clean_area'') not
              in [''unavailable'', ''unknown''] else '''' }}'
            displayValue: '{{ states(''vacuum.john'') | replace(''_'', '' '') | title
              }}'
            vacuumElapsedMinutes: '{% set t = state_attr(''vacuum.john'', ''cleaning_time'')
              %}{{ t | float(0) | int if t is not none else '''' }}'
            state: '{{ states(''vacuum.john'') }}'
          activity_push_token: 401c43b23b933ecaeaaa4dcfda7a9a0872bc3b09b7e7cfedd02ff95f0c6a4478b641ccd57de5702dea4624180c17b1b9b4512ccbf09c287207a019afcd7ec2aa5d4756e9776b096f9581ab17d3ad4c01
      message: live_activity_update
    action: notify.mobile_app_vulpo_1ee94a
  mode: queued
