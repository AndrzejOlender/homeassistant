# Scheduled cleaning on workdays (Workday sensor excludes weekends and holidays)
- alias: "Vacuum Home Workdays 12:30"
  id: vacuum_home_workdays_1230
  mode: single
  trigger:
    - platform: time
      at: "12:30:00"
  condition:
    - condition: state
      entity_id: binary_sensor.workday_sensor
      state: "on"
  action:
    - service: script.turn_on
      target:
        entity_id: script.clean_home

# iOS notification action buttons
- alias: "Vacuum Stop Actions iOS"
  id: vacuum_stop_actions_ios
  trigger:
    - platform: event
      event_type: ios.notification_action_fired
      event_data:
        actionName: STOP
  action:
    - service: script.turn_on
      target:
        entity_id: script.stop_clean_home

- alias: "Vacuum Clean Home Actions iOS"
  id: vacuum_clean_home_actions_ios
  trigger:
    - platform: event
      event_type: ios.notification_action_fired
      event_data:
        actionName: START_HOME
  action:
    - service: script.turn_on
      target:
        entity_id: script.clean_home

- alias: "Vacuum Clean White Floor Actions iOS"
  id: vacuum_clean_white_floor_actions_ios
  trigger:
    - platform: event
      event_type: ios.notification_action_fired
      event_data:
        actionName: START_WHITE_FLOOR
  action:
    - service: script.turn_on
      target:
        entity_id: script.clean_white_floor
