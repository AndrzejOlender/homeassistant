# Modern template sensors (migrated from legacy platform: template)
- sensor:
    - name: "Wind"
      unit_of_measurement: ""
      state: "{{ state_attr('weather.home', 'wind_speed') }}"
    - name: "Tracker Ania"
      state: "{% if is_state('device_tracker.samsung_a36', 'home') %}Home{% else %}Away{% endif %}"
    - name: "Tracker Andrzej"
      state: "{% if is_state('device_tracker.iphone', 'home') %}Home{% else %}Away{% endif %}"

- sensor:
    - name: "Waste Mixed Days"
      unique_id: waste_mixed_days
      icon: mdi:trash-can
      unit_of_measurement: "d"
      state: >
        {% set start = state_attr('calendar.odpady_zmieszane', 'start_time') %}
        {% if is_state('calendar.odpady_zmieszane', 'on') %}
          0
        {% elif start %}
          {{ ((as_timestamp(start) - as_timestamp(now())) / 86400) | round(0, 'ceil') }}
        {% else %}
          unknown
        {% endif %}

