# Music automation for Toilet Up
- alias: "Play Music Toilet Up on Light On"
  description: "Play jazz playlist when toilet light is turned on"
  mode: single
  trigger:
    - platform: state
      entity_id: light.shelly_toilet_up_bath
      from: "off"
      to: "on"
  condition:
    # Only between 04:00 and 23:15
    - condition: time
      after: "04:00:00"
      before: "23:15:00"
    # Only play if not already playing
    - condition: state
      entity_id: media_player.toilet_up
      state:
        - "idle"
        - "paused"
  action:
    - service: media_player.volume_set
      data:
        volume_level: 0.5
      target:
        entity_id: media_player.toilet_up
    - service: media_player.shuffle_set
      data:
        shuffle: true
      target:
        entity_id: media_player.toilet_up
    - service: media_player.play_media
      data:
        media_content_id: "library://playlist/38"
        media_content_type: "playlist"
      target:
        entity_id: media_player.toilet_up

- alias: "Stop Music Toilet Up on Light Off"
  description: "Pause music when toilet light is turned off"
  mode: single
  trigger:
    - platform: state
      entity_id: light.shelly_toilet_up_bath
      from: "on"
      to: "off"
  action:
    - service: media_player.media_pause
      target:
        entity_id: media_player.toilet_up
