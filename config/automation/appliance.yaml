# iOS notification action buttons
- alias: "Washer Power Off Actions iOS"
  id: appliance_washer_power_off_ios
  trigger:
    - platform: event
      event_type: ios.notification_action_fired
      event_data:
        actionName: POWER_OFF_WASHER
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.pralka_power

- alias: "Dryer Power Off Actions iOS"
  id: appliance_dryer_power_off_ios
  trigger:
    - platform: event
      event_type: ios.notification_action_fired
      event_data:
        actionName: POWER_OFF_DRYER
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.szuszarka_power
