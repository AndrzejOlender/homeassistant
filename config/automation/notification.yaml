# Waste collection reminder (push notification when any waste is due tomorrow)
- alias: "Waste Collection Reminder"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.waste_mixed_days') | int(99) == 1 or
           states('sensor.waste_plastic_days') | int(99) == 1 or
           states('sensor.waste_paper_days') | int(99) == 1 or
           states('sensor.waste_glass_days') | int(99) == 1 or
           states('sensor.waste_bio_days') | int(99) == 1 }}
  action:
    - service: notify.mobile_app_iphone
      data:
        title: "Waste Collection Tomorrow"
        message: >-
          {% set types = [] %}
          {% if states('sensor.waste_mixed_days') | int(99) == 1 %}
            {% set types = types + ['Zmieszane'] %}
          {% endif %}
          {% if states('sensor.waste_plastic_days') | int(99) == 1 %}
            {% set types = types + ['Plastik'] %}
          {% endif %}
          {% if states('sensor.waste_paper_days') | int(99) == 1 %}
            {% set types = types + ['Papier'] %}
          {% endif %}
          {% if states('sensor.waste_glass_days') | int(99) == 1 %}
            {% set types = types + ['Szklo'] %}
          {% endif %}
          {% if states('sensor.waste_bio_days') | int(99) == 1 %}
            {% set types = types + ['Bio'] %}
          {% endif %}
          Jutro odbior: {{ types | join(', ') }}. Wystawic pojemniki!
        data:
          push:
            sound:
              name: default

# Waste collection TTS reminder at 20:00 via ElevenLabs + Sonos
- alias: "Waste Collection TTS Reminder"
  trigger:
    - platform: time
      at: "20:00:00"
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.waste_mixed_days') | int(99) == 1 or
           states('sensor.waste_plastic_days') | int(99) == 1 or
           states('sensor.waste_paper_days') | int(99) == 1 or
           states('sensor.waste_glass_days') | int(99) == 1 or
           states('sensor.waste_bio_days') | int(99) == 1 }}
  action:
    - service: tts.speak
      target:
        entity_id: tts.elevenlabs_text_to_speech
      data:
        media_player_entity_id: media_player.office
        message: >-
          {% set types = [] %}
          {% if states('sensor.waste_mixed_days') | int(99) == 1 %}
            {% set types = types + ['zmieszane'] %}
          {% endif %}
          {% if states('sensor.waste_plastic_days') | int(99) == 1 %}
            {% set types = types + ['plastik'] %}
          {% endif %}
          {% if states('sensor.waste_paper_days') | int(99) == 1 %}
            {% set types = types + ['papier'] %}
          {% endif %}
          {% if states('sensor.waste_glass_days') | int(99) == 1 %}
            {% set types = types + ['szklo'] %}
          {% endif %}
          {% if states('sensor.waste_bio_days') | int(99) == 1 %}
            {% set types = types + ['bio'] %}
          {% endif %}
          Przypomnienie. Jutro odbiór odpadów: {{ types | join(', ') }}. Pamiętaj by wystawić pojemniki przed godziną szóstą rano.

# Weather alerts (storm, heat, wind)
- alias: "Weather Alerts"
  trigger:
    - platform: state
      entity_id: binary_sensor.burze_dzis_net_wyladowania_w_poblizu
      from: 'off'
      to: 'on'
      id: storm_nearby
    - platform: state
      entity_id: binary_sensor.burze_dzis_net_ostrzezenie_burza
      from: 'off'
      to: 'on'
      id: storm_warning
    - platform: state
      entity_id: binary_sensor.burze_dzis_net_ostrzezenie_upal
      from: 'off'
      to: 'on'
      id: heat_warning
    - platform: state
      entity_id: binary_sensor.burze_dzis_net_ostrzezenie_wiatr
      from: 'off'
      to: 'on'
      id: wind_warning
  action:
    - service: notify.mobile_app_iphone
      data:
        title: "Weather"
        message: >-
          {% set messages = {
            'storm_nearby': 'Storm nearby',
            'storm_warning': 'Storm warning',
            'heat_warning': 'Heat warning',
            'wind_warning': 'Wind warning'
          } %}
          {{ messages[trigger.id] }}
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0
