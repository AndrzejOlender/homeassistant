kiosk_mode:
  user_settings:
    - users:
        - arsen
      hide_header: true
views:
  - theme: Backend-selected
    title: Home
    icon: mdi:home-analytics
    badges: []
    cards:
      - type: conditional
        conditions:
          - condition: user
            users:
              - 4b4a93638a344e758538b4f233cb5147
              - 53b4ef7f40234de2ad73a26e61f3bd7a
        card:
          type: custom:mushroom-chips-card
          chips:
            - type: entity
              entity: person.arsen
              icon_color: blue
              use_entity_picture: true
            - type: entity
              entity: person.ania
              name: Ania
              use_entity_picture: true
            - type: entity
              entity: person.gosia
              name: Gosia
              use_entity_picture: true
            - type: entity
              entity: lock.aqara_smart_lock_u200
              icon_color: green
              use_entity_picture: false
            - type: entity
              entity: binary_sensor.maindoor_contact
              icon_color: green
              use_entity_picture: false
              content_info: state
            - type: entity
              entity: sensor.i_lo_siemianowice_slaskie_pm2_5
              icon_color: green
              use_entity_picture: false
            - type: weather
              entity: weather.home
              show_conditions: false
              show_temperature: true
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_ostrzezenie_upal
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_ostrzezenie_upal
                content_info: name
                name: Hot
                icon_color: deep-orange
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_ostrzezenie_wiatr
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_ostrzezenie_wiatr
                icon_color: pink
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_ostrzezenie_burza
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_ostrzezenie_burza
                icon_color: blue
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_wyladowania_w_poblizu
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_wyladowania_w_poblizu
                icon_color: blue
            - type: entity
              entity: binary_sensor.presense_sensor_toilet_up
              icon: mdi:motion
              icon_color: purple
            - type: entity
              entity: vacuum.john
              icon_color: green
            - type: entity
              entity: sensor.sui_wallet
              icon_color: blue
            - type: entity
              entity: binary_sensor.g5_pro_motion
              icon: mdi:cctv
              icon_color: blue
          alignment: center
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: script.good_night
            fill_container: false
            secondary_info: none
            primary_info: name
            layout: vertical
            name: Good Night
            tap_action:
              action: perform-action
              perform_action: script.good_night
          - type: custom:mushroom-entity-card
            entity: script.good_night
            fill_container: false
            secondary_info: none
            primary_info: name
            layout: vertical
            name: Good Night
            tap_action:
              action: perform-action
              perform_action: script.good_night
      - type: custom:mushroom-title-card
        title: Waste Collection
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Zmieszane
            secondary: >-
              {% set d = states('sensor.waste_mixed_days') | int(99) %} {% if d
              == 0 %}Dzis! {% elif d == 1 %}Jutro {% else %}Za {{ d }} dni{%
              endif %}
            icon: mdi:trash-can
            icon_color: |-
              {% set d = states('sensor.waste_mixed_days') | int(99) %}
              {% if d <= 1 %}red
              {% elif d <= 3 %}orange
              {% else %}grey{% endif %}
            layout: vertical
            entity: sensor.waste_mixed_days
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Plastik
            secondary: >-
              {% set d = states('sensor.waste_plastic_days') | int(99) %} {% if
              d == 0 %}Dzis! {% elif d == 1 %}Jutro {% else %}Za {{ d }} dni{%
              endif %}
            icon: mdi:recycle
            icon_color: |-
              {% set d = states('sensor.waste_plastic_days') | int(99) %}
              {% if d <= 1 %}red
              {% elif d <= 3 %}orange
              {% else %}yellow{% endif %}
            layout: vertical
            entity: sensor.waste_plastic_days
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Papier
            secondary: >-
              {% set d = states('sensor.waste_paper_days') | int(99) %} {% if d
              == 0 %}Dzis! {% elif d == 1 %}Jutro {% else %}Za {{ d }} dni{%
              endif %}
            icon: mdi:newspaper-variant-outline
            icon_color: |-
              {% set d = states('sensor.waste_paper_days') | int(99) %}
              {% if d <= 1 %}red
              {% elif d <= 3 %}orange
              {% else %}blue{% endif %}
            layout: vertical
            entity: sensor.waste_paper_days
            tap_action:
              action: more-info
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Szklo
            secondary: >-
              {% set d = states('sensor.waste_glass_days') | int(99) %} {% if d
              == 0 %}Dzis! {% elif d == 1 %}Jutro {% else %}Za {{ d }} dni{%
              endif %}
            icon: mdi:glass-fragile
            icon_color: |-
              {% set d = states('sensor.waste_glass_days') | int(99) %}
              {% if d <= 1 %}red
              {% elif d <= 3 %}orange
              {% else %}green{% endif %}
            layout: vertical
            entity: sensor.waste_glass_days
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Bio
            secondary: >-
              {% set d = states('sensor.waste_bio_days') | int(99) %} {% if d ==
              0 %}Dzis! {% elif d == 1 %}Jutro {% else %}Za {{ d }} dni{% endif
              %}
            icon: mdi:leaf
            icon_color: |-
              {% set d = states('sensor.waste_bio_days') | int(99) %}
              {% if d <= 1 %}red
              {% elif d <= 3 %}orange
              {% else %}teal{% endif %}
            layout: vertical
            entity: sensor.waste_bio_days
            tap_action:
              action: more-info
      - type: custom:mushroom-title-card
        title: Living Room
      - type: conditional
        conditions: []
        card:
          type: custom:mushroom-chips-card
          chips:
            - type: entity
              entity: sensor.air_purifier_pm2_5
              icon_color: green
            - type: entity
              entity: sensor.air_purifier_temperature
              icon_color: blue
            - type: entity
              entity: sensor.air_purifier_humidity
              icon_color: blue
          alignment: center
      - type: custom:mushroom-light-card
        entity: light.shelly_living_room_light_1
      - type: custom:mushroom-light-card
        entity: light.shelly_living_room_light_2
      - type: custom:mushroom-light-card
        entity: light.led_rtv
        name: RTV
      - type: custom:mushroom-media-player-card
        entity: media_player.tv_webos
        media_controls: []
        use_media_info: true
        icon: mdi:television
        name: TV
      - type: custom:mushroom-media-player-card
        entity: media_player.living_room
        fill_container: false
        volume_controls:
          - volume_set
          - volume_buttons
        media_controls:
          - play_pause_stop
          - next
        use_media_info: true
        show_volume_level: true
        collapsible_controls: false
        name: Apple TV
        icon: mdi:apple
      - type: custom:mushroom-media-player-card
        entity: media_player.office_2
        fill_container: false
        volume_controls:
          - volume_set
          - volume_buttons
        media_controls:
          - previous
          - play_pause_stop
          - shuffle
        use_media_info: true
        show_volume_level: true
        collapsible_controls: false
        name: Office Sonos
      - type: custom:mushroom-fan-card
        entity: fan.air_purifier
        name: Air Purifier
        icon_animation: true
        tap_action:
          action: none
        hold_action:
          action: more-info
        fill_container: true
        show_direction_control: true
        show_oscillate_control: false
        show_percentage_control: true
        collapsible_controls: false
      - type: custom:mushroom-title-card
        title: Office
      - type: custom:mushroom-light-card
        entity: light.shelly_office_1_light_1
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        double_tap_action:
          action: more-info
        name: Light 1
      - type: custom:mushroom-light-card
        entity: light.shelly_office_1_light_2
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        double_tap_action:
          action: more-info
        name: Light 2
      - type: custom:mushroom-light-card
        entity: light.desk_led
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        double_tap_action:
          action: more-info
        name: Desk
        icon: mdi:desk
      - type: custom:mushroom-title-card
        title: Toilet Up
      - type: custom:mushroom-media-player-card
        entity: media_player.toilet_up
        fill_container: false
        volume_controls:
          - volume_set
          - volume_buttons
        media_controls:
          - previous
          - play_pause_stop
          - shuffle
        use_media_info: true
        show_volume_level: true
        collapsible_controls: false
      - type: custom:mushroom-light-card
        entity: light.shelly_toilet_up_light_1
        name: Light
      - type: custom:mushroom-light-card
        entity: light.shelly_toilet_up_mirror
        icon: mdi:mirror
        name: Mirror
      - type: custom:mushroom-light-card
        entity: light.shelly_toilet_up_bath
        name: Bath Led
      - type: custom:mushroom-light-card
        entity: light.shelly_cabinet_1_light_1
        name: Cabinet
      - type: custom:mushroom-light-card
        entity: light.shelly_toilet_up_wall_light_1
        name: Wall
      - type: custom:mushroom-title-card
        title: Bedroom
      - type: custom:mushroom-light-card
        entity: light.shelly_bedroom_light_1
        icon: mdi:ceiling-light
      - type: custom:mushroom-title-card
        title: Kitchen
      - type: custom:mushroom-light-card
        entity: light.shelly_table_light_1
      - type: custom:mushroom-light-card
        entity: light.shelly_kitchen_light_1
      - type: custom:mushroom-title-card
        title: Toilet Down
      - type: conditional
        conditions: []
        card:
          type: custom:mushroom-chips-card
          chips:
            - type: entity
              entity: sensor.pralka_current_status
              icon_color: blue
              use_entity_picture: false
            - type: entity
              entity: sensor.szuszarka_current_status
              icon_color: green
              use_entity_picture: false
          alignment: center
      - type: custom:mushroom-light-card
        entity: light.shelly_toilet_down_light_1
        name: Light
      - type: custom:mushroom-title-card
        title: Hall Down
      - type: custom:mushroom-light-card
        entity: light.shelly_hall_down
      - type: custom:mushroom-title-card
        title: Hall Up
      - type: custom:mushroom-light-card
        entity: light.shelly_hall_up_light_1
        name: Hall Up
      - type: custom:mushroom-light-card
        entity: light.shelly_stairs_light_1
        name: Stairs
  - type: sections
    max_columns: 1
    theme: Mushroom
    path: vacuum
    icon: mdi:robot-vacuum
    title: Vacuum
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Vacuum
            heading_style: title
            icon: mdi:robot-vacuum
          - type: custom:mushroom-vacuum-card
            entity: vacuum.john
      - type: grid
        cards:
          - type: custom:xiaomi-vacuum-map-card
            vacuum_platform: Roborock
            entity: vacuum.john
            map_source:
              camera: image.roborock_live_map
            calibration_source:
              camera: true
            map_modes:
              - template: vacuum_clean_segment
              - template: vacuum_clean_zone
              - template: vacuum_goto
      - type: grid
        cards:
          - type: tile
            entity: script.clean_home
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.clean_home
          - type: tile
            entity: script.clean_hall
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.clean_hall
          - type: tile
            entity: script.clean_dining_room
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.clean_dining_room
          - type: tile
            entity: script.clean_kitchen
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.clean_kitchen
          - type: tile
            entity: script.clean_living_room
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.clean_living_room
          - type: tile
            entity: script.clean_toilet_down
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.clean_toilet_down
        column_span: 1
    badges:
      - type: entity
        entity: vacuum.john
  - type: panel
    theme: Mushroom
    path: gosia
    icon: mdi:map-marker-account
    title: Gosia
    cards:
      - type: map
        entities:
          - person.gosia
        hours_to_show: 12
        default_zoom: 17
        dark_mode: true
