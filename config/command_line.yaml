# Command line sensors

# SUI Wallet Portfolio Tracker
# Fetches all tokens from SUI wallet and calculates total USD value
- sensor:
    name: SUI Wallet
    unique_id: sui_wallet_portfolio
    command: "python3 /config/scripts/sui_wallet.py"
    scan_interval: 600
    value_template: "{{ value_json.total_usd }}"
    unit_of_measurement: "USD"
    json_attributes:
      - tokens
      - token_count
      - wallet
      - error

# Tauron G12W Cost Updater
# Computes and imports the tauron_g12w:cost external statistic from the
# Tauron grid consumption stat, priced per G12W day/night zone. Idempotent -
# only processes newly-complete days, safe to run repeatedly.
- sensor:
    name: Tauron G12W Cost Updater
    unique_id: tauron_g12w_cost_updater
    command: "python3 /config/scripts/tauron_g12w_cost.py"
    scan_interval: 21600
    command_timeout: 120
    value_template: "{{ value_json.status }}"
    json_attributes:
      - processed_days
      - skipped_incomplete
      - hours_imported
      - import_verified
      - running_total_pln
      - day_rate
      - night_rate
      - monthly_fee
      - error

# Aqua-Sprint Water Meter (eBOK)
# Logs into the Aqua-Sprint eBOK portal, reads the water meter's cumulative
# Stan (m3) and imports it as the aqua_sprint:water_consumption external
# statistic, attributing each delta to its reading date so a calendar month
# containing one reading totals exactly what that invoice says. The utility
# only publishes a new radio reading every ~30 days, so most runs are a no-op.
# Also prices the series into aqua_sprint:water_cost (water + sewage + fixed
# monthly fee, gross) from the input_number.aqua_sprint_* rate helpers, and
# wires that into the Energy dashboard's water source as stat_cost.
# Requires a one-time `python3 scripts/aqua_sprint_water.py --seed` first;
# after changing a rate helper, run `--rebuild-cost` to reprice history.
- sensor:
    name: Aqua-Sprint Water Updater
    unique_id: aqua_sprint_water_updater
    command: "python3 /config/scripts/aqua_sprint_water.py"
    scan_interval: 43200
    command_timeout: 120
    value_template: "{{ value_json.status }}"
    json_attributes:
      - last_reading_date
      - last_reading_m3
      - days_imported
      - import_verified
      - cost_days_imported
      - cost_total_pln
      - cost_verified
      - rate_per_m3_gross
      - cost_source_wired
      - session
      - error
