# Music automation for Toilet Up
- alias: "Play Music Toilet Up on Presence"
  description: "Play jazz playlist when presence detected in toilet"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presense_sensor_toilet_up
      from: "off"
      to: "on"
  condition:
    # Only between 07:00 and 20:00
    - condition: time
      after: "04:00:00"
      before: "23:15:00"
    # Only play if not already playing
    - condition: state
      entity_id: media_player.toilet_up
      state:
        - "idle"
        - "paused"
  action:
    - service: media_player.volume_set
      data:
        volume_level: 0.5
      target:
        entity_id: media_player.toilet_up
    - service: media_player.shuffle_set
      data:
        shuffle: true
      target:
        entity_id: media_player.toilet_up
    - service: media_player.play_media
      data:
        media_content_id: "library://playlist/35"
        media_content_type: "playlist"
      target:
        entity_id: media_player.toilet_up

- alias: "Stop Music Toilet Up on No Presence"
  description: "Pause music when no presence detected for 10 seconds"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.presense_sensor_toilet_up
      from: "on"
      to: "off"
      for:
        seconds: 10
  action:
    - service: media_player.media_pause
      target:
        entity_id: media_player.toilet_up
