- alias: Notify Doorbell Pressed
  id: notify_doorbell_pressed
  mode: single
  trigger:
    - platform: event
      event_type: zha_event
      event_data:
        device_id: "094470bcb55b470f147d29ef7929d7db"
        command: vibration
  condition:
    # Debounce: one press can emit multiple action events
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none
           or (now() - this.attributes.last_triggered).total_seconds() > 10 }}
  action:
    - service: notify.mobile_app_iphone
      data:
        title: "Doorbell"
        message: "Someone is at the door"
    - service: script.notify_active_mac
      data:
        title: "Doorbell"
        message: "Someone is at the door"
