- alias: Send Notification Opened Lock
  trigger:
    - platform: state
      entity_id: lock.aqara_smart_lock_u200
      to: "unlocked"
  action:
    - service: notify.mobile_app_iphone
      data:
        title: "Lock"
        message: "Lock Opened"
        data:
          actions:
            - action: "LOCK"
              title: 'Lock'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
              icon: "sfsymbols:lock"
            - action: "UNLOCK"
              title: 'Unlock'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
              icon: "sfsymbols:lock.open"

- alias: Send Notification Closed Lock
  trigger:
    - platform: state
      entity_id: lock.aqara_smart_lock_u200
      to: "locked"
  action:
    - service: notify.mobile_app_iphone
      data:
        title: "Lock"
        message: "Lock Closed"
        data:
          actions:
            - action: "UNLOCK"
              title: 'Unlock'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
              icon: "sfsymbols:lock.open"
            - action: "LOCK"
              title: 'Lock'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
              icon: "sfsymbols:lock"
            - action: "START_HOME"
              title: 'Clean Home'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
              icon: "sfsymbols:lifepreserver"
            - action: "START_WORK_DAY"
              title: 'Work Day'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
              icon: "sfsymbols:desktopcomputer"

# Vacuum
- alias: Send Notification Vacuum Start
  trigger:
    platform: state
    entity_id: vacuum.john
    from: "docked"
    to: "cleaning"
  action:
    - service: tts.speak
      target:
        entity_id: tts.elevenlabs_text_to_speech
      data:
        media_player_entity_id: media_player.office
        message: "Odkurzacz rozpoczął sprzątanie mieszkania."
    - service:  notify.mobile_app_iphone
      data:
        message: "Vacuum Started Cleaning"
        data:
          actions:
            - action: "STOP"
              title: 'Stop'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
            - action: "START"
              title: 'Start'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false

- alias: Send Notification Vacuum Stop
  trigger:
    platform: state
    entity_id: vacuum.john
    from:
      - "cleaning"
      - "returning"
      - "idle"
    to: "docked"
  action:
    - service: tts.speak
      target:
        entity_id: tts.elevenlabs_text_to_speech
      data:
        media_player_entity_id: media_player.office
        message: "Odkurzacz skończył odkurzanie mieszkania."
    - service:  notify.mobile_app_iphone
      data:
        message: "Vacuum Finished Cleaning"
        data:
          actions:
            - action: "START"
              title: 'Start'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false
            - action: "STOP"
              title: 'Stop'
              activationMode: 'background'
              authenticationRequired: false
              destructive: false

- alias: "Very Bad Air"
  trigger:
    - platform: numeric_state
      entity_id: sensor.air_purifier_pm2_5
      above: 100
  action:
    - service: tts.speak
      target:
        entity_id: tts.elevenlabs_text_to_speech
      data:
        media_player_entity_id: media_player.office
        message: "Uwaga! bardzo zła jakość powietrza w mieszkaniu."
    - service:  notify.mobile_app_iphone
      data:
        title: "Air"
        message: "Very Bad Air"

- alias: Send Notification Enter Zone Home
  trigger:
    platform: zone
    entity_id:
      - person.ania
      - person.gosia
    zone: zone.home
    event: enter
  action:
    - service:  notify.mobile_app_iphone
      data:
        title: "Location"
        message: "{{ trigger.to_state.name }} went into zone Home"
        data:
          push:
            category: map
            sound: default
          action_data:
            shows_traffic: true
            shows_compass: true
            shows_points_of_interest: true
            latitude: "{{ state_attr(trigger.entity_id, 'latitude') }}"
            longitude: "{{ state_attr(trigger.entity_id, 'longitude') }}"  

