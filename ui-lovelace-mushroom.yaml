kiosk_mode:
  user_settings:
    - users:
        - arsen
      hide_header: true
views:
  - theme: Backend-selected
    title: Home
    icon: mdi:home-analytics
    badges: []
    cards:
      - type: conditional
        conditions:
          - condition: user
            users:
              - 4b4a93638a344e758538b4f233cb5147
        card:
          type: custom:mushroom-chips-card
          chips:
            - type: entity
              entity: person.arsen
              icon_color: blue
              use_entity_picture: true
            - type: entity
              entity: person.ania
              name: Ania
              use_entity_picture: true
            - type: entity
              entity: lock.maindoorlock
              icon_color: green
              use_entity_picture: false
            - type: entity
              entity: binary_sensor.maindoor_contact
              icon_color: green
              use_entity_picture: false
              content_info: state
            - type: entity
              entity: sensor.i_lo_siemianowice_slaskie_pm2_5
              icon_color: green
              use_entity_picture: false
            - type: weather
              entity: weather.home
              show_conditions: false
              show_temperature: true
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_ostrzezenie_upal
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_ostrzezenie_upal
                content_info: name
                name: Hot
                icon_color: deep-orange
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_ostrzezenie_wiatr
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_ostrzezenie_wiatr
                icon_color: pink
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_ostrzezenie_burza
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_ostrzezenie_burza
                icon_color: blue
            - type: conditional
              conditions:
                - entity: binary_sensor.burze_dzis_net_wyladowania_w_poblizu
                  state: 'on'
              chip:
                type: entity
                entity: binary_sensor.burze_dzis_net_wyladowania_w_poblizu
                icon_color: blue
            - type: entity
              entity: binary_sensor.presense_sensor_toilet_up
              icon: mdi:motion
              icon_color: purple
            - type: entity
              entity: vacuum.john
              icon_color: green
            - type: entity
              entity: sensor.sui_wallet
              icon_color: blue
            - type: entity
              entity: camera.g5_pro_high_resolution_channel
              icon_color: blue
          alignment: center
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: script.good_night
            fill_container: false
            secondary_info: none
            primary_info: name
            layout: vertical
            name: Good Night
            tap_action:
              action: perform-action
              perform_action: script.good_night
          - type: custom:mushroom-entity-card
            entity: script.good_night
            fill_container: false
            secondary_info: none
            primary_info: name
            layout: vertical
            name: Good Night
            tap_action:
              action: perform-action
              perform_action: script.good_night
      - type: custom:mushroom-title-card
        title: Office
      - type: custom:mushroom-light-card
        entity: light.shelly_office_1_light_1
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        double_tap_action:
          action: more-info
      - type: custom:mushroom-light-card
        entity: light.shelly_office_1_light_2
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        double_tap_action:
          action: more-info
      - type: custom:mushroom-light-card
        entity: light.desk_led
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        double_tap_action:
          action: more-info
        name: Desk
      - type: custom:mushroom-media-player-card
        entity: media_player.office_2
        fill_container: false
        volume_controls:
          - volume_set
          - volume_buttons
        media_controls:
          - previous
          - play_pause_stop
          - shuffle
        use_media_info: true
        show_volume_level: true
        collapsible_controls: false
        name: Office Sonos
      - type: custom:mushroom-title-card
        title: Toilet
      - type: custom:mushroom-media-player-card
        entity: media_player.toilet_up
        fill_container: false
        volume_controls:
          - volume_set
          - volume_buttons
        media_controls:
          - previous
          - play_pause_stop
          - shuffle
        use_media_info: true
        show_volume_level: true
        collapsible_controls: false
