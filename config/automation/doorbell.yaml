- alias: Notify Doorbell Pressed
  mode: single
  trigger:
    - platform: event
      event_type: zha_event
      event_data:
        device_ieee: "54:ef:44:10:01:36:c9:2c"
        command: vibration
  condition:
    # Debounce: one press can emit multiple action events
    - condition: template
      value_template: >-
        {{ this.attributes.last_triggered is none
           or (now() - this.attributes.last_triggered).total_seconds() > 10 }}
  action:
    - service: notify.mobile_app_iphone
      data:
        title: "Doorbell"
        message: "Someone is at the door"
    - service: script.notify_active_mac
      data:
        title: "Doorbell"
        message: "Someone is at the door"
    - service: notify.mobile_app_samsung_a36
      data:
        title: "Doorbell"
        message: "Ring ring, ktoś dzwoni do drzwi"
